<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Return Assistant</title>
<style>
	:root {
		--bg: #f4f5f7; --surface: #ffffff; --text: #1c1e21; --muted: #667085; --line: #e3e6ea;
		--accent: #2f5bea; --accent-text: #ffffff; --user-bg: #2f5bea; --user-text: #ffffff;
		--bot-bg: #eef1f6; --error-bg: #fdecec; --error-text: #a12626; --chip: #e8edff;
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--bg: #14161a; --surface: #1d2025; --text: #e8eaed; --muted: #9aa3b2; --line: #2d3138;
			--accent: #6c8cff; --accent-text: #0e1116; --user-bg: #3a56c9; --user-text: #ffffff;
			--bot-bg: #272b33; --error-bg: #3a1f1f; --error-text: #ffb4b4; --chip: #262d45;
		}
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	[hidden] { display: none !important; }
	button, input, textarea { font: inherit; color: inherit; }
	button { cursor: pointer; }

	/* login */
	#login-view { min-height: 100%; display: grid; place-items: center; padding: 24px; }
	.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 380px; }
	.card h1 { font-size: 20px; margin: 0 0 4px; }
	.card p { margin: 0 0 20px; color: var(--muted); }
	label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
	input[type=email], input[type=password], textarea {
		width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
	}
	input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
	.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
	.primary:disabled { opacity: .55; cursor: default; }
	.card .primary { width: 100%; margin-top: 18px; }
	.form-error { color: var(--error-text); background: var(--error-bg); border-radius: 8px; padding: 8px 12px; margin-top: 14px; font-size: 14px; }
	.auth-switch { display: block; margin: 14px auto 0; padding: 4px 8px; border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; }
	.auth-switch:hover { text-decoration: underline; }

	/* app */
	#app-view { height: 100%; display: flex; flex-direction: column; }
	header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
	header h1 { font-size: 17px; margin: 0; flex: 1; }
	.who { font-size: 13px; color: var(--muted); text-align: right; }
	.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
	.ghost:hover { background: var(--bot-bg); }
	main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(210px, 250px) minmax(0, 1fr) minmax(220px, 280px); gap: 16px; padding: 16px 20px; }
	aside, .chat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 0; display: flex; flex-direction: column; }
	aside h2 { font-size: 14px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
	#products { list-style: none; margin: 0; padding: 8px; overflow-y: auto; }
	#products li > .product-ask { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; }
	#products li > .product-ask:hover { background: var(--bot-bg); border-color: var(--line); }
	.product-row { display: flex; align-items: stretch; gap: 2px; }
	#products li > .product-row > .product-ask { flex: 1; min-width: 0; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; }
	#products li > .product-row > .product-ask:hover { background: var(--bot-bg); border-color: var(--line); }
	.product-description { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.4; }
	.product-add-button { display: block; margin: 8px; width: calc(100% - 16px); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600; }
	.product-add-button:hover { border-color: var(--accent); color: var(--accent); background: var(--chip); }
	.product-more { flex: 0 0 34px; align-self: center; height: 34px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 21px; line-height: 1; }
	.product-more:hover, .product-more:focus-visible { background: var(--bot-bg); color: var(--text); }
	.product-menu { position: fixed; z-index: 20; width: 190px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 10px 30px rgba(0, 0, 0, .16); }
	.product-menu button { display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 13px; }
	.product-menu button:hover, .product-menu button:focus-visible { background: var(--bot-bg); outline: none; }
	dialog.owner-dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); box-shadow: 0 18px 55px rgba(0, 0, 0, .22); }
	dialog.owner-dialog::backdrop { background: rgba(15, 20, 28, .42); }
	.owner-dialog form { padding: 20px; }
	.owner-dialog h2 { margin: 0 0 6px; font-size: 17px; }
	.owner-dialog p { margin: 0 0 14px; color: var(--muted); }
	.owner-dialog label { margin-top: 14px; }
	.owner-dialog input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
	.owner-dialog input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
	.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
	.dialog-owner { overflow-wrap: anywhere; color: var(--text) !important; font-weight: 600; }
	.dialog-error { margin-top: 10px !important; color: var(--error-text) !important; }
	.product-accordion { min-height: 0; }
	.product-accordion summary { list-style: none; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto 12px; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; border-radius: 10px; transition: background .16s ease; }
	.product-accordion summary::-webkit-details-marker { display: none; }
	.product-accordion summary:hover { background: var(--bot-bg); }
	.product-accordion summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
	.product-icon { width: 36px; height: 36px; display: grid; grid-template-columns: repeat(2, 6px); grid-template-rows: repeat(2, 6px); place-content: center; gap: 3px; border-radius: 10px; background: var(--chip); }
	.product-icon i { width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }
	.product-copy { min-width: 0; }
	.product-title { display: block; font-size: 14px; font-weight: 650; }
	.product-subtitle { display: block; color: var(--muted); font-size: 12px; }
	.product-count { padding: 3px 8px; border-radius: 999px; background: var(--bot-bg); color: var(--muted); font-size: 12px; font-weight: 600; }
	.product-chevron { width: 8px; height: 8px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); transition: transform .18s ease; }
	.product-accordion[open] .product-chevron { transform: rotate(225deg) translate(-2px, -1px); }
	#products { max-height: min(38vh, 320px); overflow-y: auto; border-top: 1px solid var(--line); }
	.sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
	.sidebar-heading h2 { border: 0; padding-left: 0; }
	#conversations { flex: 1; min-height: 0; list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
	.conversation-row { display: flex; align-items: center; gap: 4px; }
	.conversation-row.active { background: var(--chip); border-radius: 8px; }
	.conversation-open { min-width: 0; flex: 1; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; overflow: hidden; }
	.conversation-title, .conversation-preview { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.conversation-title { font-weight: 600; }
	.conversation-preview { color: var(--muted); font-size: 12px; }
	.conversation-delete { border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; color: var(--muted); }
	.conversation-delete:hover { color: var(--error-text); background: var(--error-bg); }
	.p-name { font-weight: 600; display: block; }
	.p-meta { font-size: 13px; color: var(--muted); display: block; }
	.empty { color: var(--muted); padding: 12px; font-size: 14px; }

	#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
	.msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
	.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); white-space: pre-wrap; border-bottom-right-radius: 4px; }
	.msg.assistant { align-self: flex-start; background: var(--bot-bg); border-bottom-left-radius: 4px; }
	.msg.error { align-self: flex-start; background: var(--error-bg); color: var(--error-text); }
	.msg.pending { align-self: flex-start; background: var(--bot-bg); color: var(--muted); }
	.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
	.msg ul, .msg ol { margin: 0 0 8px; padding-left: 22px; }
	.msg .md-h { font-weight: 700; margin-top: 4px; }
	.msg hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
	.msg code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
	.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
	.chip { background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
	form#chat-form { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: flex-end; }
	#chat-input { resize: none; max-height: 140px; }

	/* logs panel (administrators) */

	.msg-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
	#log-panel { border-top: 1px solid var(--line); background: var(--bg); }
	.log-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; flex-wrap: wrap; }
	.log-tabs, .log-actions { display: flex; gap: 6px; align-items: center; }
	.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 4px 8px; font-size: 13px; color: var(--muted); }
	.tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
	.ghost.small, #log-source { font-size: 12px; padding: 3px 8px; }
	#log-source { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
	#log-lines { max-height: 180px; overflow-y: auto; padding: 4px 12px 10px; font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
	.log-line { white-space: pre-wrap; overflow-wrap: anywhere; }
	.log-line.error { color: var(--error-text); }
	.log-line.warn { color: #b7791f; }
	.log-time { color: var(--muted); margin-right: 8px; }
	@media (max-width: 1050px) and (min-width: 821px) {
		main { grid-template-columns: minmax(190px, 220px) minmax(0, 1fr) minmax(200px, 230px); gap: 10px; padding-inline: 12px; }
	}
	@media (max-width: 820px) {
		main { grid-template-columns: 1fr; grid-template-rows: auto minmax(320px, 1fr) auto; gap: 10px; padding: 12px; overflow-y: auto; }
		.products-panel { max-height: 180px; }
		.saved-panel { max-height: 190px; }
		.msg { max-width: 94%; }
	}

	/* ---------- visual theme overrides ---------- */
	:root {
		--bg: #eceff3; --surface: #ffffff; --text: #14202b; --muted: #5d6b7a; --line: #dbe1e8;
		--accent: #0f766e; --accent-text: #ffffff; --user-bg: #14202b; --user-text: #ffffff;
		--bot-bg: #f2f5f8; --chip: #dcf0ec; --ink: #14202b; --ink-text: #eef3f7;
		--radius: 12px; --shadow: 0 1px 2px rgba(20, 32, 43, .06), 0 8px 24px rgba(20, 32, 43, .06);
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--bg: #0d1419; --surface: #151e26; --text: #e6edf2; --muted: #8b9aa8; --line: #25313c;
			--accent: #3fc1b0; --accent-text: #06201c; --user-bg: #1f3d47; --user-text: #ffffff;
			--bot-bg: #1b262f; --chip: #173430; --ink: #0a1015; --ink-text: #e6edf2;
			--shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
		}
	}
	body {
		font: 15px/1.55 "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	h1, h2 { letter-spacing: 0; }

	/* Brand mark */
	.card h1::before, header h1::before {
		content: "\21A9"; display: inline-grid; place-items: center; width: 28px; height: 28px;
		margin-right: 10px; border-radius: 8px; background: var(--accent); color: var(--accent-text);
		font-size: 16px; font-weight: 700; vertical-align: 2px;
	}

	/* Login */
	#login-view {
		background:
			radial-gradient(900px 420px at 15% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
			var(--bg);
	}
	.card { max-width: 400px; padding: 36px 32px; border-radius: 18px; box-shadow: var(--shadow); animation: card-in .45s ease-out both; }
	.card h1 { font-size: 22px; margin-bottom: 6px; }
	.card p { font-size: 14px; }
	label { font-weight: 500; }
	input[type=email], input[type=password], textarea { padding: 11px 13px; border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
	input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
	.primary { border-radius: 10px; padding: 11px 18px; transition: filter .15s, transform .05s; }
	.primary:hover:not(:disabled) { filter: brightness(1.08); }
	.primary:active:not(:disabled) { transform: translateY(1px); }
	@keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

	/* Header */
	header { background: var(--ink); color: var(--ink-text); border-bottom: 0; padding: 12px 24px; }
	header h1 { font-size: 16px; font-weight: 650; display: flex; align-items: center; }
	header h1::before { margin-right: 10px; vertical-align: 0; }
	.who { color: color-mix(in srgb, var(--ink-text) 65%, transparent); }
	header .ghost { color: var(--ink-text); border-color: color-mix(in srgb, var(--ink-text) 22%, transparent); transition: background .15s, border-color .15s; }
	header .ghost:hover { background: color-mix(in srgb, var(--ink-text) 10%, transparent); }
	header .ghost[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

	/* Panels */
	main { padding: 20px 24px; gap: 18px; }
	aside, .chat { border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
	aside h2 { font-size: 14px; font-weight: 650; }
	.ghost { transition: background .15s, border-color .15s; }

	/* Products */
	.product-accordion summary { padding: 14px 16px; border-radius: 0; }
	.product-icon { background: var(--chip); border-radius: 10px; }
	.product-count { background: var(--chip); color: var(--accent); }
	#products { padding: 6px; }
	#products li > .product-row > .product-ask { position: relative; border-radius: 10px; transition: background .15s; }
	#products li > .product-row > .product-ask::before {
		content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px;
		background: var(--accent); opacity: 0; transition: opacity .15s;
	}
	#products li > .product-row > .product-ask:hover { border-color: transparent; }
	#products li > .product-row > .product-ask:hover::before { opacity: 1; }
	.product-more { border-radius: 8px; }
	.product-more:hover, .product-more:focus-visible { background: var(--chip); color: var(--accent); }
	.product-menu, dialog.owner-dialog { border-radius: 14px; }
	dialog.owner-dialog::backdrop { backdrop-filter: blur(2px); }
	.p-name { font-size: 14px; }
	.p-meta { font-size: 12.5px; }

	/* Saved chats */
	.conversation-row { border-radius: 10px; transition: background .15s; }
	.conversation-row:hover { background: var(--bot-bg); }
	.conversation-row.active { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
	.conversation-title { font-size: 14px; }
	.conversation-delete { opacity: 0; transition: opacity .15s; }
	.conversation-row:hover .conversation-delete, .conversation-row:focus-within .conversation-delete { opacity: 1; }

	/* Chat */
	#messages { padding: 22px 22px 12px; gap: 14px; scroll-behavior: smooth; }
	.msg { border-radius: var(--radius); padding: 11px 15px; max-width: 80%; }
	.msg.user { border-bottom-right-radius: 4px; }
	.msg.assistant { background: var(--bot-bg); border-left: 3px solid var(--accent); border-bottom-left-radius: var(--radius); border-top-left-radius: 4px; }
	.msg.pending { border: 1px dashed var(--line); background: transparent; }
	.msg.pending::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; vertical-align: middle; }
	@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
	.msg strong { font-weight: 650; }
	.msg-meta { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 10px; }
	.chips { padding: 4px 22px 14px; }
	.chip { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 7px 14px; transition: background .15s, border-color .15s, color .15s; }
	.chip:hover { background: var(--chip); border-color: var(--accent); color: var(--accent); }
	form#chat-form { padding: 14px 18px; background: var(--surface); }
	#chat-input { border-radius: 12px; }
	#send { align-self: stretch; padding-inline: 22px; }

	/* Logs */
	#log-panel { background: var(--ink); color: var(--ink-text); border-top: 0; }
	#log-panel .tab { color: color-mix(in srgb, var(--ink-text) 60%, transparent); }
	#log-panel .tab.active { color: var(--ink-text); border-bottom-color: var(--accent); }
	#log-panel .ghost, #log-source { color: var(--ink-text); border-color: color-mix(in srgb, var(--ink-text) 22%, transparent); background: transparent; }
	#log-source option { color: #14202b; }
	#log-panel .log-time { color: color-mix(in srgb, var(--ink-text) 45%, transparent); }
	#log-panel .log-line.error { color: #ff9b9b; }
	#log-panel .log-line.warn { color: #f0c36d; }

	/* Scrollbars and accessibility */
	* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
	:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
	}
	@media (max-width: 820px) {
		main { padding: 12px; }
		.msg { max-width: 92%; }
		.conversation-delete { opacity: 1; }
	}
</style>
</head>
<body>

<section id="login-view">
	<form class="card" id="login-form">
		<h1>Retail Return Assistant</h1>
		<label for="email">Email</label>
		<input id="email" type="email" autocomplete="username" required>
		<label for="password">Password</label>
		<input id="password" type="password" autocomplete="current-password" required>
		<div class="form-error" id="login-error" role="alert" hidden></div>
		<button class="primary" id="login-button" type="submit">Log in</button>
		<button class="auth-switch" id="show-signup" type="button">Create a new account</button>
	</form>
	<form class="card" id="signup-form" hidden>
		<h1>Create account</h1>
		<label for="signup-email">Email</label>
		<input id="signup-email" type="email" autocomplete="email" required maxlength="150">
		<label for="signup-password">Password</label>
		<input id="signup-password" type="password" autocomplete="new-password" required minlength="10" maxlength="200">
		<label for="signup-confirm-password">Confirm password</label>
		<input id="signup-confirm-password" type="password" autocomplete="new-password" required minlength="10" maxlength="200">
		<div class="form-error" id="signup-error" role="alert" hidden></div>
		<button class="primary" id="signup-button" type="submit">Create account</button>
		<button class="auth-switch" id="show-login" type="button">Back to log in</button>
	</form>
</section>

<section id="app-view" hidden>
	<header>
		<h1>Retail Return Assistant</h1>
		<div class="who" id="who"></div>
		<button class="ghost" id="toggle-logs" type="button" aria-expanded="false">Logs</button>
		<button class="ghost" id="new-chat" type="button">New chat</button>
		<button class="ghost" id="logout" type="button">Log out</button>
	</header>
	<main>
		<aside class="products-panel">
			<button class="product-add-button" id="add-product-button" type="button" hidden>Add product</button>
			<details class="product-accordion" id="product-accordion">
				<summary>
					<span class="product-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
					<span class="product-copy">
						<span class="product-title">My products</span>
						<span class="product-subtitle">Choose an item to investigate</span>
					</span>
					<span class="product-count" id="product-count">…</span>
					<span class="product-chevron" aria-hidden="true"></span>
				</summary>
				<ul id="products"></ul>
			</details>
		</aside>
		<section class="chat">
			<div id="messages" aria-live="polite"></div>
			<div id="log-panel" hidden>
				<div class="log-head">
					<div class="log-tabs">
						<button type="button" class="tab active" id="tab-session">This session</button>
						<button type="button" class="tab" id="tab-server" hidden>Server log</button>
					</div>
					<div class="log-actions">
						<select id="log-source" hidden aria-label="Server log file">
							<option value="chat">chat.log</option>
							<option value="app">app.log</option>
						</select>
						<button type="button" class="ghost small" id="log-refresh" hidden>Refresh</button>
						<button type="button" class="ghost small" id="log-copy">Copy</button>
						<button type="button" class="ghost small" id="log-clear">Clear</button>
					</div>
				</div>
				<div id="log-lines" role="log"></div>
			</div>
			<div class="chips" id="chips"></div>
			<form id="chat-form">
				<textarea id="chat-input" rows="1" maxlength="2000" placeholder="Ask about your products’ returns…" aria-label="Your question"></textarea>
				<button class="primary" id="send" type="submit">Send</button>
			</form>
		</section>
		<aside class="saved-panel">
			<div class="sidebar-heading"><h2>Saved chats</h2><button class="ghost small" id="new-chat-side" type="button">New</button></div>
			<ul id="conversations"></ul>
		</aside>
	</main>
</section>

<div id="product-menu" class="product-menu" role="group" aria-label="Product actions" hidden>
	<button id="view-product-owner" type="button">View assigned user</button>
	<button id="assign-product-owner" type="button">Assign to user</button>
	<button id="delete-product" type="button">Delete product</button>
</div>

<dialog id="owner-view-dialog" class="owner-dialog">
	<form method="dialog">
		<h2 id="owner-view-title">Product assignment</h2>
		<p id="owner-view-content"></p>
		<div class="dialog-actions"><button class="ghost" value="close">Close</button></div>
	</form>
</dialog>

<dialog id="owner-assign-dialog" class="owner-dialog">
	<form id="owner-assign-form">
		<h2 id="owner-assign-title">Assign product</h2>
		<p>Enter the email address of the user who should own this product.</p>
		<label for="owner-email">User email</label>
		<input id="owner-email" type="email" maxlength="150" required autocomplete="off">
		<p id="owner-assign-error" class="dialog-error" role="alert" hidden></p>
		<div class="dialog-actions">
			<button class="ghost" id="owner-assign-cancel" type="button">Cancel</button>
			<button class="primary" id="owner-assign-submit" type="submit">Assign</button>
		</div>
	</form>
</dialog>

<dialog id="add-product-dialog" class="owner-dialog">
	<form id="add-product-form">
		<h2>Add product</h2>
		<label for="new-product-name">Product name</label>
		<input id="new-product-name" type="text" maxlength="150" required>
		<label for="new-product-category">Category</label>
		<input id="new-product-category" type="text" maxlength="100" required>
		<label for="new-product-brand">Brand</label>
		<input id="new-product-brand" type="text" maxlength="100" required>
		<label for="new-product-price">Price</label>
		<input id="new-product-price" type="number" min="0" step="0.01" required>
		<label for="new-product-description">Description</label>
		<textarea id="new-product-description" rows="3" maxlength="5000"></textarea>
		<p id="add-product-error" class="dialog-error" role="alert" hidden></p>
		<div class="dialog-actions">
			<button class="ghost" id="add-product-cancel" type="button">Cancel</button>
			<button class="primary" id="add-product-submit" type="submit">Save product</button>
		</div>
	</form>
</dialog>

<script>
(() => {
	const $ = (id) => document.getElementById(id);
	const CHAT_TIMEOUT_MS = 150000;   // stop waiting for an answer after 2.5 minutes
	const state = { token: null, role: null, email: null, conversationId: null, conversations: [], busy: false };
	const SUGGESTIONS = [
		"Which of my products have high returns?",
		"Show the return rate of each of my products",
		"What do customers say about my products?",
	];

	/* ---------- session ---------- */
	function saveSession() {
		try { sessionStorage.setItem("session", JSON.stringify({ token: state.token, role: state.role, email: state.email })); } catch {}
	}
	function loadSession() {
		try {
			const s = JSON.parse(sessionStorage.getItem("session") || "null");
			if (s && s.token) Object.assign(state, s);
		} catch {}
	}
	function logout(message) {
		state.token = state.role = state.email = null;
		state.conversationId = null;
		state.conversations = [];
		$("login-form").hidden = false;
		$("signup-form").hidden = true;
		$("signup-password").value = "";
		$("signup-confirm-password").value = "";
		$("log-panel").hidden = true;
		$("toggle-logs").setAttribute("aria-expanded", "false");
		setLogTab("session");
		try { sessionStorage.removeItem("session"); } catch {}
		$("app-view").hidden = true;
		$("login-view").hidden = false;
		const box = $("login-error");
		box.hidden = !message;
		box.textContent = message || "";
		$("password").value = "";
	}

	/* ---------- activity log (what the page did; shown in the Logs panel) ---------- */
	const logs = [];
	let logTab = "session", serverLines = [];
	const stamp = () => new Date().toLocaleTimeString([], { hour12: false });
	function log(level, text) {
		logs.push({ time: stamp(), level, text });
		if (logs.length > 300) logs.shift();
		if (logTab === "session") paintLogs();
	}
	function paintLogs() {
		const box = $("log-lines");
		box.textContent = "";
		const rows = logTab === "session" ? logs : serverLines.map((text) => ({
			time: "", text, level: /\b(ERROR|CRITICAL)\b/.test(text) ? "error" : /\bWARNING\b/.test(text) ? "warn" : "info",
		}));
		if (!rows.length) rows.push({ time: "", level: "info", text: logTab === "session" ? "Nothing logged yet." : "The log file is empty." });
		for (const row of rows) {
			const line = document.createElement("div");
			line.className = "log-line " + row.level;
			if (row.time) { const t = document.createElement("span"); t.className = "log-time"; t.textContent = row.time; line.appendChild(t); }
			line.appendChild(document.createTextNode(row.text));
			box.appendChild(line);
		}
		box.scrollTop = box.scrollHeight;
	}
	function setLogTab(tab) {
		logTab = tab;
		$("tab-session").classList.toggle("active", tab === "session");
		$("tab-server").classList.toggle("active", tab === "server");
		$("log-source").hidden = $("log-refresh").hidden = tab !== "server";
		$("log-clear").hidden = tab !== "session";
		if (tab === "server") loadServerLog(); else paintLogs();
	}
	async function loadServerLog() {
		try {
			serverLines = (await api("/chat/logs?source=" + $("log-source").value + "&lines=150", { quiet: true })).lines;
		} catch (err) {
			serverLines = ["Could not load the server log: " + err.message];
		}
		if (logTab === "server") paintLogs();
	}

	/* ---------- API ---------- */
	class ApiError extends Error {
		constructor(message, status) { super(message); this.status = status; }
	}
	async function api(path, { method = "GET", body, timeout = 30000, quiet = false } = {}) {
		const headers = { "Content-Type": "application/json" };
		if (state.token) headers.Authorization = "Bearer " + state.token;
		const controller = new AbortController();
		const timer = setTimeout(() => controller.abort(), timeout);
		const started = performance.now();
		const took = () => ((performance.now() - started) / 1000).toFixed(1) + "s";
		let res;
		try {
			res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined, signal: controller.signal });
		} catch (err) {
			const timedOut = err.name === "AbortError";
			log("error", method + " " + path + " → " + (timedOut ? "no answer after " + took() + " (timed out)" : "cannot reach the server"));
			throw new ApiError(timedOut
				? "The server is taking too long to answer. Please try again in a moment."
				: "Cannot reach the server. Is it running?", 0);
		} finally {
			clearTimeout(timer);
		}
		let data = null;
		try { data = await res.json(); } catch {}
		if (!res.ok) {
			const detail = data && data.detail;
			if (!quiet) log("error", method + " " + path + " → " + res.status + " (" + took() + ")" + (typeof detail === "string" ? ": " + detail : ""));
			if (res.status === 401 && state.token) logout("Your session has expired. Please log in again.");
			if (typeof detail === "string") throw new ApiError(detail, res.status);
			if (res.status >= 500) throw new ApiError("The server had an internal error. Please try again.", res.status);
			throw new ApiError("The request failed (" + res.status + ").", res.status);
		}
		if (!quiet) log("info", method + " " + path + " → " + res.status + " (" + took() + ")");
		return data;
	}

	/* ---------- text rendering (safe: HTML is escaped before formatting) ---------- */
	const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
	function renderMarkdown(source) {
		let html = "", list = null, m;
		const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
		const item = (tag, text) => { if (list !== tag) { close(); html += "<" + tag + ">"; list = tag; } html += "<li>" + inline(text) + "</li>"; };
		for (const raw of escapeHtml(source).split(/\r?\n/)) {
			const line = raw.trimEnd();
			if ((m = line.match(/^\s*[*-]\s+(.*)$/))) item("ul", m[1]);
			else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) item("ol", m[1]);
			else if (!line.trim()) close();
			else if ((m = line.match(/^#{1,6}\s+(.*)$/))) { close(); html += '<p class="md-h">' + inline(m[1]) + "</p>"; }
			else if (/^-{3,}$/.test(line.trim())) { close(); html += "<hr>"; }
			else { close(); html += "<p>" + inline(line) + "</p>"; }
		}
		close();
		return html;
	}

	/* ---------- chat ---------- */
	function addMessage(kind, text, meta) {
		const el = document.createElement("div");
		el.className = "msg " + kind;
		if (kind === "assistant") el.innerHTML = renderMarkdown(text);
		else el.textContent = text;
		if (meta) {
			const note = document.createElement("div");
			note.className = "msg-meta";
			note.textContent = meta;
			el.appendChild(note);
		}
		$("messages").appendChild(el);
		el.scrollIntoView({ block: "end" });
		return el;
	}
	function setBusy(busy) {
		state.busy = busy;
		$("send").disabled = busy;
		$("chat-input").disabled = busy;
		if (!busy) $("chat-input").focus();
	}
	async function ask(text, selectedProductId = null) {
		text = (text || "").trim();
		if (!text || state.busy) return;
		if (!state.conversationId) {
			try { await startNewChat(); } catch (err) { addMessage("error", err.message); return; }
		}
		addMessage("user", text);
		$("chat-input").value = "";
		autoGrow();
		setBusy(true);
		const pending = addMessage("pending", "Thinking… this can take up to a minute.");
		log("info", "Question sent: " + text.slice(0, 120));
		try {
			const data = await api("/chat", {
				method: "POST",
				timeout: CHAT_TIMEOUT_MS,
				body: { conversation_id: state.conversationId, message: text, selected_product_id: selectedProductId },
			});
			pending.remove();
			const events = data.events || [];
			for (const e of events) {
				const args = Object.entries(e.args || {}).map(([k, v]) => k + "=" + v).join(", ");
				log(e.status === "ok" ? "info" : "error", "tool " + e.tool + "(" + args + ") → " + e.status + " in " + e.ms + " ms");
			}
			const secs = ((data.duration_ms || 0) / 1000).toFixed(1);
			log("info", "Answer ready in " + secs + "s · model " + data.model + " · ref " + data.ref);
			const tools = [...new Set(events.map((e) => e.tool))];
			addMessage("assistant", data.reply, secs + " s · " + (tools.length ? "tools: " + tools.join(", ") : "no tools used") + " · ref " + data.ref);
			await loadConversations({ openLatest: false });
		} catch (err) {
			pending.remove();
			if (state.token) addMessage("error", err.message);
		} finally {
			setBusy(false);
		}
	}
	function resetChat() {
		$("messages").innerHTML = "";
		addMessage("assistant", "Hi! I can tell you which of **your** products have high returns and why. Pick a product on the left or try a question below.");
	}
	function renderConversations(items) {
		const list = $("conversations");
		list.innerHTML = "";
		if (!items.length) {
			const empty = document.createElement("li");
			empty.className = "empty";
			empty.textContent = "No saved chats yet.";
			list.appendChild(empty);
			return;
		}
		for (const item of items) {
			const row = document.createElement("li");
			row.className = "conversation-row" + (item.conversation_id === state.conversationId ? " active" : "");
			const open = document.createElement("button");
			open.type = "button";
			open.className = "conversation-open";
			open.title = item.title;
			const title = document.createElement("span");
			title.className = "conversation-title";
			title.textContent = item.title;
			const preview = document.createElement("span");
			preview.className = "conversation-preview";
			preview.textContent = item.last_message || "Empty conversation";
			open.append(title, preview);
			open.disabled = state.busy;
			open.addEventListener("click", () => openConversation(item.conversation_id));
			const remove = document.createElement("button");
			remove.type = "button";
			remove.className = "conversation-delete";
			remove.textContent = "Delete";
			remove.title = "Delete saved chat";
			remove.setAttribute("aria-label", "Delete " + item.title);
			remove.disabled = state.busy;
			remove.addEventListener("click", (event) => deleteConversation(item.conversation_id, event));
			row.append(open, remove);
			list.appendChild(row);
		}
	}
	async function loadConversations({ openLatest = true } = {}) {
		state.conversations = await api("/chat/conversations");
		renderConversations(state.conversations);
		if (state.conversationId && !state.conversations.some((item) => item.conversation_id === state.conversationId)) {
			state.conversationId = null;
		}
		if (openLatest && !state.conversationId && state.conversations.length) {
			await openConversation(state.conversations[0].conversation_id);
		}
	}
	async function openConversation(id) {
		if (state.busy) return;
		const conversation = await api("/chat/conversations/" + id);
		state.conversationId = conversation.conversation_id;
		$("messages").innerHTML = "";
		if (!conversation.messages.length) {
			resetChat();
		} else {
			for (const message of conversation.messages) {
				const meta = message.role === "assistant" && (message.ref || message.model)
					? [message.model, message.ref && "ref " + message.ref].filter(Boolean).join(" · ")
					: null;
				addMessage(message.role === "assistant" ? "assistant" : "user", message.content, meta);
			}
		}
		renderConversations(state.conversations);
	}
	async function startNewChat() {
		const conversation = await api("/chat/conversations", { method: "POST", body: {} });
		state.conversationId = conversation.conversation_id;
		resetChat();
		await loadConversations({ openLatest: false });
		renderConversations(state.conversations);
	}
	async function deleteConversation(id, event) {
		event.stopPropagation();
		if (state.busy) return;
		const item = state.conversations.find((conversation) => conversation.conversation_id === id);
		if (!confirm("Delete “" + (item ? item.title : "this chat") + "”? This cannot be undone.")) return;
		try {
			await api("/chat/conversations/" + id, { method: "DELETE" });
			if (state.conversationId === id) state.conversationId = null;
			await loadConversations();
			if (!state.conversationId) resetChat();
		} catch (err) {
			addMessage("error", err.message);
		}
	}
	function autoGrow() {
		const box = $("chat-input");
		box.style.height = "auto";
		box.style.height = Math.min(box.scrollHeight, 140) + "px";
	}

	/* ---------- products ---------- */
	const formatPrice = (value) => {
		const n = Number(value);
		return Number.isFinite(n) ? n.toLocaleString(undefined, { maximumFractionDigits: 2 }) : String(value);
	};
	let selectedProduct = null;
	const productMenu = $("product-menu");
	function openProductMenu(product, x, y) {
		if (state.role !== "administrator") return;
		selectedProduct = product;
		productMenu.hidden = false;
		const bounds = productMenu.getBoundingClientRect();
		productMenu.style.left = Math.max(8, Math.min(x, window.innerWidth - bounds.width - 8)) + "px";
		productMenu.style.top = Math.max(8, Math.min(y, window.innerHeight - bounds.height - 8)) + "px";
		$("view-product-owner").focus();
	}
	function closeProductMenu() {
		productMenu.hidden = true;
	}
	function showProductOwner() {
		if (!selectedProduct) return;
		closeProductMenu();
		$("owner-view-title").textContent = selectedProduct.product_name;
		$("owner-view-content").textContent = selectedProduct.owner_email
			? "Assigned to " + selectedProduct.owner_email
			: "No user is currently assigned to this product.";
		$("owner-view-dialog").showModal();
	}
	function showProductAssignment() {
		if (!selectedProduct) return;
		closeProductMenu();
		$("owner-assign-title").textContent = "Assign " + selectedProduct.product_name;
		$("owner-email").value = selectedProduct.owner_email || "";
		$("owner-assign-error").hidden = true;
		$("owner-assign-dialog").showModal();
		$("owner-email").focus();
	}
	async function deleteSelectedProduct() {
		if (!selectedProduct) return;
		closeProductMenu();
		const productName = selectedProduct.product_name;
		if (!confirm("Delete product \"" + productName + "\"? This action cannot be undone.")) {
			return;
		}
		try {
			await api("/products/" + selectedProduct.product_id, { method: "DELETE" });
			log("info", "Deleted product " + productName + " (id " + selectedProduct.product_id + ")");
			selectedProduct = null;
			await loadProducts();
		} catch (err) {
			alert(err.message);
		}
	}
	async function loadProducts() {
		const list = $("products");
		list.innerHTML = "";
		const products = await api("/products");
		$("product-count").textContent = products.length + (products.length === 1 ? " item" : " items");
		if (!products.length) {
			const li = document.createElement("li");
			li.className = "empty";
			li.textContent = "No products are assigned to you yet.";
			list.appendChild(li);
			return;
		}
		for (const p of products) {
			const li = document.createElement("li");
			const row = document.createElement("div");
			row.className = "product-row";
			const button = document.createElement("button");
			button.type = "button";
			button.className = "product-ask";
			button.title = "Ask about this product";
			const name = document.createElement("span"); name.className = "p-name"; name.textContent = p.product_name;
			const meta = document.createElement("span"); meta.className = "p-meta";
			meta.textContent = ["ID " + p.product_id, p.category, p.brand, formatPrice(p.price)].join(" · ");
			button.append(name, meta);
			if (p.description) {
				const description = document.createElement("span");
				description.className = "product-description";
				description.textContent = p.description;
				button.appendChild(description);
			}
			button.addEventListener("click", () => ask("Why the return rate of " + p.product_name + " is high?", p.product_id));
			row.appendChild(button);
			if (state.role === "administrator") {
				const more = document.createElement("button");
				more.type = "button";
				more.className = "product-more";
				more.textContent = "⋯";
				more.setAttribute("aria-label", "Product actions for " + p.product_name);
				more.setAttribute("aria-haspopup", "true");
				more.addEventListener("click", (event) => {
					event.stopPropagation();
					const bounds = more.getBoundingClientRect();
					openProductMenu(p, bounds.right, bounds.bottom + 4);
				});
				row.appendChild(more);
				li.addEventListener("contextmenu", (event) => {
					event.preventDefault();
					openProductMenu(p, event.clientX, event.clientY);
				});
			}
			li.appendChild(row);
			list.appendChild(li);
		}
	}
	$("view-product-owner").addEventListener("click", showProductOwner);
	$("assign-product-owner").addEventListener("click", showProductAssignment);
	$("delete-product").addEventListener("click", deleteSelectedProduct);
	productMenu.addEventListener("keydown", (event) => {
		const actions = [...productMenu.querySelectorAll("button")];
		const current = actions.indexOf(document.activeElement);
		if (event.key === "ArrowDown" || event.key === "ArrowUp") {
			event.preventDefault();
			actions[(current + (event.key === "ArrowDown" ? 1 : actions.length - 1)) % actions.length].focus();
		}
	});
	document.addEventListener("pointerdown", (event) => {
		if (!productMenu.hidden && !productMenu.contains(event.target)) closeProductMenu();
	});
	document.addEventListener("keydown", (event) => {
		if (event.key === "Escape") closeProductMenu();
	});
	window.addEventListener("resize", closeProductMenu);
	$("owner-assign-cancel").addEventListener("click", () => $("owner-assign-dialog").close());
	$("owner-assign-form").addEventListener("submit", async (event) => {
		event.preventDefault();
		if (!selectedProduct) return;
		const submit = $("owner-assign-submit");
		const error = $("owner-assign-error");
		const email = $("owner-email").value.trim();
		submit.disabled = true;
		error.hidden = true;
		try {
			await api("/products/" + selectedProduct.product_id + "/owner", { method: "PATCH", body: { email } });
			log("info", "Assigned " + selectedProduct.product_name + " to " + email);
			$("owner-assign-dialog").close();
			await loadProducts();
		} catch (err) {
			error.textContent = err.message;
			error.hidden = false;
		} finally {
			submit.disabled = false;
		}
	});

	async function showApp() {
		$("login-view").hidden = true;
		$("app-view").hidden = false;
		$("who").textContent = state.email + " · " + state.role;
		$("tab-server").hidden = state.role !== "administrator";
		$("add-product-button").hidden = state.role !== "administrator";
		resetChat();
		try {
			await loadProducts();
			await loadConversations();
		} catch (err) { if (state.token) addMessage("error", err.message); }
	}

	/* ---------- wiring ---------- */
	$("chips").append(...SUGGESTIONS.map((q) => {
		const b = document.createElement("button");
		b.type = "button"; b.className = "chip"; b.textContent = q;
		b.addEventListener("click", () => ask(q));
		return b;
	}));
	$("login-form").addEventListener("submit", async (e) => {
		e.preventDefault();
		const button = $("login-button"), box = $("login-error");
		box.hidden = true;
		button.disabled = true;
		try {
			const email = $("email").value.trim();
			const data = await api("/auth/login", { method: "POST", body: { email, password: $("password").value } });
			Object.assign(state, { token: data.access_token, role: data.role, email });
			logs.length = 0;
			log("info", "Logged in as " + email + " (" + data.role + ")");
			saveSession();
			await showApp();
		} catch (err) {
			box.textContent = err.message;
			box.hidden = false;
		} finally {
			button.disabled = false;
		}
	});
	$("show-signup").addEventListener("click", () => {
		$("login-error").hidden = true;
		$("login-form").hidden = true;
		$("signup-form").hidden = false;
		$("signup-email").value = $("email").value.trim();
		$("signup-email").focus();
	});
	$("show-login").addEventListener("click", () => {
		$("signup-error").hidden = true;
		$("signup-form").hidden = true;
		$("login-form").hidden = false;
		$("email").value = $("signup-email").value.trim();
		$("email").focus();
	});
	$("add-product-button").addEventListener("click", () => {
		$("add-product-error").hidden = true;
		$("add-product-dialog").showModal();
		$("new-product-name").focus();
	});
	$("add-product-cancel").addEventListener("click", () => $("add-product-dialog").close());
	$("add-product-form").addEventListener("submit", async (event) => {
		event.preventDefault();
		const submit = $("add-product-submit");
		const error = $("add-product-error");
		submit.disabled = true;
		error.hidden = true;
		try {
			await api("/products", {
				method: "POST",
				body: {
					product_name: $("new-product-name").value.trim(),
					category: $("new-product-category").value.trim(),
					brand: $("new-product-brand").value.trim(),
					price: Number($("new-product-price").value),
					description: $("new-product-description").value.trim() || null,
					is_active: true,
				},
			});
			log("info", "Added product " + $("new-product-name").value.trim());
			$("add-product-form").reset();
			$("add-product-dialog").close();
			$("product-accordion").open = true;
			await loadProducts();
		} catch (err) {
			error.textContent = err.message;
			error.hidden = false;
		} finally {
			submit.disabled = false;
		}
	});
	$("signup-form").addEventListener("submit", async (event) => {
		event.preventDefault();
		const button = $("signup-button");
		const error = $("signup-error");
		const email = $("signup-email").value.trim();
		const password = $("signup-password").value;
		const confirmation = $("signup-confirm-password").value;
		error.hidden = true;
		if (password !== confirmation) {
			error.textContent = "Passwords do not match.";
			error.hidden = false;
			return;
		}
		button.disabled = true;
		try {
			const data = await api("/auth/signup", {
				method: "POST",
				body: { email, password, password_confirmation: confirmation },
			});
			Object.assign(state, { token: data.access_token, role: data.role, email: email.toLowerCase() });
			logs.length = 0;
			log("info", "Account created for " + email + " (" + data.role + ")");
			saveSession();
			await showApp();
		} catch (err) {
			error.textContent = err.message;
			error.hidden = false;
		} finally {
			button.disabled = false;
		}
	});
	$("chat-form").addEventListener("submit", (e) => { e.preventDefault(); ask($("chat-input").value); });
	$("chat-input").addEventListener("keydown", (e) => {
		if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask($("chat-input").value); }
	});
	$("chat-input").addEventListener("input", autoGrow);
	const newChat = async () => {
		if (state.busy) return;
		try { await startNewChat(); } catch (err) { addMessage("error", err.message); }
	};
	$("new-chat").addEventListener("click", newChat);
	$("new-chat-side").addEventListener("click", newChat);
	$("logout").addEventListener("click", () => logout());

	$("toggle-logs").addEventListener("click", () => {
		const panel = $("log-panel");
		panel.hidden = !panel.hidden;
		$("toggle-logs").setAttribute("aria-expanded", String(!panel.hidden));
		if (!panel.hidden) setLogTab(logTab);
	});
	$("tab-session").addEventListener("click", () => setLogTab("session"));
	$("tab-server").addEventListener("click", () => setLogTab("server"));
	$("log-source").addEventListener("change", loadServerLog);
	$("log-refresh").addEventListener("click", loadServerLog);
	$("log-clear").addEventListener("click", () => { logs.length = 0; paintLogs(); });
	$("log-copy").addEventListener("click", async () => {
		const text = logTab === "session" ? logs.map((l) => l.time + " " + l.text).join("\n") : serverLines.join("\n");
		try { await navigator.clipboard.writeText(text); $("log-copy").textContent = "Copied"; }
		catch { $("log-copy").textContent = "Select and copy by hand"; }
		setTimeout(() => { $("log-copy").textContent = "Copy"; }, 1500);
	});

	loadSession();
	if (state.token) showApp(); else logout();
})();
</script>
</body>
</html>
